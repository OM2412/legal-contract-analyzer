services:
  - type: web
    name: folio-accounts-preview
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/OM2412/legal-contract-analyzer
    branch: feature/accounts-and-saved-reviews
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: db

      - key: FOLIO_DB_URL
        fromDatabase:
          name: folio-accounts-preview-db
          property: connectionString

      - key: FOLIO_DB_USER
        fromDatabase:
          name: folio-accounts-preview-db
          property: user

      - key: FOLIO_DB_PASSWORD
        fromDatabase:
          name: folio-accounts-preview-db
          property: password

      - key: FOLIO_DEMO_AUTH_ENABLED
        value: "true"

      - key: FOLIO_DEMO_USERNAME
        value: mentor

      - key: FOLIO_DEMO_PASSWORD
        sync: false

      - key: FOLIO_AI_ENABLED
        value: "false"

      - key: FOLIO_PASSWORD_RESET_ENABLED
        value: "false"

      - key: FOLIO_PASSWORD_RECOVERY_WORKER_ENABLED
        value: "false"

      - key: SERVER_SERVLET_SESSION_COOKIE_SECURE
        value: "true"

      - key: SERVER_SERVLET_SESSION_COOKIE_HTTP_ONLY
        value: "true"

      - key: SERVER_SERVLET_SESSION_COOKIE_SAME_SITE
        value: lax

databases:
  - name: folio-accounts-preview-db
    plan: free
    region: singapore