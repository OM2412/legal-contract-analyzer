services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: folio
      POSTGRES_USER: folio
      POSTGRES_PASSWORD: ${FOLIO_DB_PASSWORD:?Set FOLIO_DB_PASSWORD before starting}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - folio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folio -d folio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  folio_pgdata: